schema = "changerail.local-delivery.v1"
max_wall_minutes = 45
max_review_cycles = 2
require_clean_start = true
require_push = true

[admission]
max_expected_wall_minutes = 30
max_acceptance_criteria = 4
max_production_owners = 1
max_runtime_contours = 1
max_estimated_product_files = 5
max_estimated_production_loc = 300

[models.implementation]
model = "gpt-5.6-terra"
reasoning_effort = "high"

[models.review]
model = "gpt-6-astra"
reasoning_effort = "high"

[budgets]
# Timing, size and command estimates are observations; two reviews remain a hard shared limit.
enforce_limits = false
first_edit_discovery_commands = 8
first_edit_hard_stop_commands = 12
review_commands = 12
review_verdict_only_commands = 20
review_hard_stop_commands = 24
tool_output_token_limit = 4000

[verification]
pre_review_commands = [
  "git diff --check",
  "uv run python -m scripts.qa_compile_changed",
  "./bin/openspec validate --specs --strict --no-interactive",
]
final_commands = [
  "git diff --check",
  "uv run pytest -v --qa-changed --qa-lane offline --durations=10",
  "uv run pytest -v --qa-changed --qa-lane integration --durations=10",
  "uv run python -m scripts.qa_compile_changed",
  "./bin/openspec validate --specs --strict --no-interactive",
]

[history]
manifest = ".changerail/history.json"

[project]
hooks_path = "scripts/git-hooks"

[adapters.codex]
launcher = "bin/codex"

[evidence]
reuse = "rerun"
