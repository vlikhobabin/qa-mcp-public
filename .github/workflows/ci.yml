name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Explicitly authorize full offline/integration tests"
        type: boolean
        default: false
      reason:
        description: "Epic card or operator agreement (required for full suite)"
        type: string

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Explicit CI provisioning; ordinary OpenSpec commands have no download fallback.
      - name: Provision pinned local OpenSpec
        run: npm --prefix tools/openspec ci --ignore-scripts --no-audit --no-fund

      - name: Select comparison base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "QA_TEST_BASE=$base" >> "$GITHUB_ENV"

      - name: Affected offline product tests
        if: ${{ !inputs.full_suite }}
        run: uv run pytest -q --qa-changed --qa-lane offline --durations=10

      - name: Affected subprocess, build and display integration
        if: ${{ !inputs.full_suite }}
        run: uv run pytest -q --qa-changed --qa-lane integration --durations=10

      - name: Explicitly authorized full offline suite
        if: ${{ inputs.full_suite }}
        env:
          QA_FULL_REASON: ${{ inputs.reason }}
        run: uv run pytest -q --qa-full=approved --qa-reason "$QA_FULL_REASON" --qa-lane offline --cov=qa_mcp --durations=10

      - name: Explicitly authorized full integration and coverage
        if: ${{ inputs.full_suite }}
        env:
          QA_FULL_REASON: ${{ inputs.reason }}
        run: uv run pytest -q --qa-full=approved --qa-reason "$QA_FULL_REASON" --qa-lane integration --cov=qa_mcp --cov-append --cov-fail-under=60 --durations=10
